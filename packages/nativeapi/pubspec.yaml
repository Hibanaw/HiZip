name: nativeapi
description: "HiZip-maintained native desktop and HarmonyOS host APIs."
version: 0.2.7+hizip.1
homepage: https://github.com/libnativeapi/nativeapi-flutter
publish_to: none

environment:
  sdk: ^3.9.2
  flutter: ">=1.17.0"

dependencies:
  ffi: ">=1.2.1 <3.0.0"
  flutter:
    sdk: flutter
  cnativeapi: 0.2.7
  file_selector: ^1.1.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.6
  path: ^1.9.1
  meta: ^1.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      ohos:
        pluginClass: NativeApiPlugin
